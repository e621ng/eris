[workspace]
resolver = "2"
members = [
  "crates/eris-core",
  "crates/eris-store",
  "crates/eris-server",
  "crates/eris-migrate",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/e621ng/eris"

[workspace.dependencies]
eris-core = { path = "crates/eris-core" }
eris-store = { path = "crates/eris-store" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hdrhistogram = "7"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
parking_lot = "0.12"
proptest = "1"
rand = "0.8"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
lto = "thin"
