name: 2. Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/run-checks.yml

  release:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      # Tags pushed with the default GITHUB_TOKEN don't trigger other
      # workflows; the app token is what lets "3. Publish" fire.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        run: cargo set-version --bump ${{ inputs.bump }}

      # All crates inherit workspace.package.version, so any package
      # reports the release version.
      - name: Get new version
        id: version
        run: |
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "[Release] Version ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push
          git push --tags
