name: CI

on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Includes the golden fixtures recorded from the C++ oracle and the
      # proptest reference-parity suites; no services needed.
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "64"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Store + API suites: trigger semantics, bootstrap race, follower
      # convergence (two nodes through one database), full HTTP flows.
      - run: cargo test --workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  differential:
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p eris-server -p eris-migrate
      - name: Start the C++ oracle on the committed subsample
        run: |
          mkdir -p /tmp/oracle
          cp testdata/subsample-10k.db /tmp/oracle/oracle.db
          docker run -d --name oracle -p 5588:5588 -v /tmp/oracle:/data \
            ghcr.io/e621ng/iqdb:b988f000f17008677c7546c0c13623bc956b585d \
            iqdb http 0.0.0.0 5588 /data/oracle.db
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5588/status && break; sleep 1
          done
      - name: Import the subsample and start ERIS
        run: |
          ./target/release/eris-migrate import \
            --sqlite testdata/subsample-10k.db \
            --database-url postgres://postgres:postgres@localhost:5432/eris
          ERIS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/eris \
            ERIS_LISTEN=127.0.0.1:5589 ./target/release/eris-server &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5589/ready && break; sleep 1
          done
      - name: Differential run
        run: |
          ./target/release/eris-migrate diff \
            --corpus testdata/corpus-ci.jsonl \
            --oracle http://127.0.0.1:5588 \
            --subject http://127.0.0.1:5589 \
            --limit 20 --report diff-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diff-report
          path: diff-report.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, differential]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/e621ng/eris:${{ github.ref_name }}
            ghcr.io/e621ng/eris:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
